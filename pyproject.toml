[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hggs"
version = "0.1.0"
description = "Annotation-guided 3D Gaussian compression for heritage-detail preserving mobile AR."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Authors"}
]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
  "scipy>=1.9"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0"
]

[project.scripts]
hggs-compress = "hggs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
